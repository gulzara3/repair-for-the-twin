name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[figures,dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest
      - name: Reproduce headline numbers
        run: repair4twin summary
      - name: Regenerate figures and tables
        run: |
          python scripts/make_figures.py --out /tmp/figures
          python scripts/make_tables.py --out /tmp/tables
