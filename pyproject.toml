[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repair4twin"
version = "1.0.0"
description = "Decision-aware evaluation of sensor-data imputation for digital-twin prognostics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Author One" }, { name = "Author Two" }, { name = "Author Three" }]
keywords = [
  "digital twin", "remaining useful life", "missing data", "imputation",
  "uncertainty quantification", "conformal prediction", "predictive maintenance", "C-MAPSS",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
deep = ["torch>=2.3", "pypots==1.5", "h5py"]
figures = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["repair4twin[deep,figures,dev]"]

[project.scripts]
repair4twin = "repair4twin.cli:main"

[project.urls]
Repository = "https://github.com/gulzara3/repair-for-the-twin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["repair4twin"]
